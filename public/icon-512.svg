<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#dc2626" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Outer Emblem Shield -->
  <path d="M256 64 L416 128 C416 280 256 390 256 430 C256 390 96 280 96 128 Z" fill="#27272a" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Inner Martial Flame / Keris Silhouette -->
  <g transform="translate(0, 10)" filter="url(#glow)">
    <path d="M256 110 C290 180 340 220 310 290 C290 340 256 370 256 370 C256 370 222 340 202 290 C172 220 222 180 256 110 Z" fill="url(#redGrad)"/>
    
    <!-- Martial Strike / Blade Highlights -->
    <path d="M256 140 C270 190 295 230 280 275 C270 305 256 335 256 335 C256 335 242 305 232 275 C217 230 242 190 256 140 Z" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="256" cy="240" r="28" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Yin-Yang / Dynamic Balance Motif -->
    <path d="M256 212 A 14 14 0 0 1 256 240 A 14 14 0 0 0 256 268 A 28 28 0 0 1 256 212" fill="#18181b"/>
    <circle cx="256" cy="226" r="4.5" fill="#ffffff"/>
    <circle cx="256" cy="254" r="4.5" fill="#18181b"/>
  </g>

  <!-- Text Badge -->
  <rect x="136" y="405" width="240" height="42" rx="21" fill="#991b1b" stroke="#fca5a5" stroke-width="2"/>
  <text x="256" y="432" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">SILAT REPORT</text>
</svg>
