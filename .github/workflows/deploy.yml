name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: "!contains(github.event.head_commit.message, 'chore: build and sync GitHub Pages bundle')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build application
        env:
          VITE_INDEX_MODE: github
        run: npm run build

      - name: Commit and push compiled bundle to branch for GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- package-lock.json 2>/dev/null || true
          touch .nojekyll
          git add -f public/gh-bundle/app.js public/gh-bundle/app.css .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: build and sync GitHub Pages bundle"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
          gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow 2>/dev/null || true
          gh api -X POST repos/${{ github.repository }}/pages/builds 2>/dev/null || true

      - name: Configure Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.configure_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.configure_pages.outcome == 'success'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
